# dsh-plugin-metric-dashboard — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "dashboard".
# Tools resultantes: mcp__dashboard__* (ver README).
- insert:
    - id: mcp-metric-dashboard
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dashboard
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/metric-dashboard/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
